# Declarative routes, reloaded automatically when this file changes.
#
# Hosts (all *.example.test, RFC 6761 reserved; see README for the hosts file):
#   app.example.test   SPA, BFF endpoints (/bff/*) and the APIs behind the BFF (/api/*)
#   auth.example.test  Keycloak
# TLS ends here, with the dev certificate from scripts/dev_pki.py.

