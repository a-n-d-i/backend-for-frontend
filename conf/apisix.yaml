global_rules:
  - id: https
    plugins:
      # plain http only redirects [RFC 9700 2.6]
      redirect:
        http_to_https: true
      # browsers use https only for these hosts from now on
      response-rewrite:
        headers:
          set:
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"

plugin_configs:
  # The token handler (BFF), shared by the /bff and /api routes so both use
  # the same configuration and the same sessions. `value` is passed to
  # TokenHandler.config() as a raw JSON string; see DEFAULTS in
  # plugins/tokenhandler.py for the options. `apis` is the allowlist of APIs
  # the BFF forwards to, each with the audience and scope its token is
  # exchanged for (BBA 6.1.3.6). The client secret matches
  # conf/keycloak/demo-realm.json; in production it comes from a secret store.
  # DEV ONLY: trace_file records requests that carry X-Trace-Id (only the
  # tests send it) for the traffic report, tokens included. Never set it in
  # production.
  - id: bff
    plugins:
      ext-plugin-pre-req:
        conf:
          - name: tokenhandler
            value: |
              {
                "issuer": "https://auth.example.test/realms/demo",
                "client_id": "bff",
                "client_secret": "bff-secret",
                "redirect_uri": "https://app.example.test/bff/callback",
                "ca_file": "/workspace/conf/pki/ca.pem",
                "apis": {
                  "/api/a/": {"audience": "service-a", "scope": "api-a"},
                  "/api/b/": {"audience": "service-b", "scope": "api-b"}
                },
                "trace_file": "/workspace/traffic-report/bff-trace.jsonl"
              }

routes:
  # Keycloak; it knows its public URL (KC_HOSTNAME), APISIX adds X-Forwarded-*
  - id: keycloak
    host: auth.example.test
    uri: /*
    upstream:
      type: roundrobin
      pass_host: pass
      nodes:
        "keycloak:8080": 1

  # BFF endpoints: login, callback, session, logout, back-channel logout.
  # Answered by the plugin, nothing reaches the upstream.
  - id: bff
    host: app.example.test
    uri: /bff/*
    plugin_config_id: bff
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:9081": 1

  # The APIs behind the BFF: the plugin swaps the session cookie for a token
  # exchanged for exactly this service. These routes are the allowlist of
  # upstreams the BFF proxies to (BBA 6.1.3.6).
  - id: api-a
    host: app.example.test
    uri: /api/a/*
    plugin_config_id: bff
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/a/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "service-a:7001": 1

  - id: api-b
    host: app.example.test
    uri: /api/b/*
    plugin_config_id: bff
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/b/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "service-b:7002": 1

  # Any other /api/ path: the plugin answers 404, it is not an allowed API.
  - id: api-unknown
    host: app.example.test
    uri: /api/*
    plugin_config_id: bff
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:9081": 1

  # The Vue SPA, static files served by the server block in config.yaml.
  - id: spa
    host: app.example.test
    uri: /*
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:9081": 1
#END
