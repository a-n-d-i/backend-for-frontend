# APISIX static config. Changes need `make reload` (or a container restart).
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml   # routes come from apisix.yaml, no etcd

apisix:
  # 80 only redirects to https (global rule in apisix.yaml)
  node_listen: 80
  ssl:
    enable: true
    listen:
      - port: 443
    # trust anchors for the BFF's back-channel TLS (Keycloak): the system
    # store, which holds the CA of Vault's PKI (installed by gateway-entrypoint.sh)
    ssl_trusted_certificate: system
  # the tokenhandler plugin: lua/apisix/plugins/tokenhandler.lua
  extra_lua_path: "/workspace/lua/?.lua"
  # line coverage for `make coverage-e2e`; a no-op otherwise (lua/luacov_gateway.lua)
  lua_module_hook: "luacov_gateway"

# Only the plugins in use (this list replaces APISIX's default one).
plugins:
  - redirect          # global rule: http -> https
  - response-rewrite  # global rule: HSTS
  - proxy-rewrite     # strips /api/a, /api/b
  - tokenhandler      # the BFF
# no TCP/UDP (stream) proxying
stream_plugins: []

nginx_config:
  error_log_level: warn
  http:
    custom_lua_shared_dict:
      # Vault secret cache (shared by all workers; the BFF sessions and seen
      # logout-token ids are in Redis)
      tokenhandler-cache: 1m
  # Static server for the Vue SPA in spa/, reached through the `spa` route.
  # Loopback only: the browser gets it via APISIX (https://app.example.test), same origin as
  # the BFF, which is what lets the BFF use SameSite=Strict cookies and
  # refuse every cross-origin request.
  http_configuration_snippet: |
    server {
        listen 127.0.0.1:9081;
        root /workspace/spa;
        access_log off;

        location / {
            # client-side routing: unknown paths get the app
            try_files $uri /index.html;
            add_header Cache-Control no-cache;
            # Strict CSP: only our own scripts, no inline code, no eval (the
            # SPA uses Vue's runtime-only build). Limits what injected markup
            # can do, though the BFF does not rely on it to keep tokens away
            # [BBA 6.1.4]. frame-ancestors + X-Frame-Options: no clickjacking.
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
    }
